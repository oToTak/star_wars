core_axioms:
  - id: "AX-ORGANIC-CHARS"
    label: "Органічність та суб'єктність"
    polarity: "love"
    intensity: 1.0
    domain: ["character_writing", "worldbuilding"]
    description: "Персонажі мають власну рутину, звички та логіку дій незалежно від потреб сюжету. Вони відчуваються живими людьми з об'єктною постійністю."
    exemplars_positive: ["T-STEINS-GATE", "T-TED-LASSO", "T-SAMURAI-CHAMPLOO", "T-1923"]
    exemplars_negative: ["T-PROMISED-NEVERLAND"]
    status: "active"

  - id: "AX-INTELLECT-STRAT"
    label: "Інтелект і стратегія"
    polarity: "love"
    intensity: 0.9
    domain: ["plot_structure", "conflict_resolution"]
    description: "Багаторівневі плани, інтриги, тактичне та креативне використання здібностей замість грубої сили, змагальна логіка. Довіра до компетентного інтелектуального якоря (ГГ)."
    exemplars_positive: ["T-CODE-GEASS", "T-PING-PONG", "T-FIVE-LITTLE-PIGS"]
    exemplars_negative: ["T-PROMISED-NEVERLAND", "T-ICELANDIC-NOIR"]
    status: "active"

  - id: "AX-PSYCH-DEPTH"
    label: "Психологія та незбагненне"
    polarity: "love"
    intensity: 0.85
    domain: ["theme", "character_writing"]
    description: "Дослідження того, як формується розум (через травми/досвід), або зіткнення з інтелектуально вищим чи абсолютно незбагненним."
    exemplars_positive: ["T-MONSTER", "T-ALGERNON"]
    exemplars_negative: []
    status: "active"

  - id: "AX-FORCED-MELO"
    label: "Штучна мелодрама"
    polarity: "hate"
    intensity: -1.0
    domain: ["character_writing", "directing", "music"]
    description: "Награні емоції, надмірне ниття, маніпулятивне нав'язування почуттів глядачу через музику, монтаж або пафосні діалоги. Дратуючі, нелогічні романтичні лінії."
    exemplars_positive: ["T-RE-ZERO", "T-VIOLET-EVERGARDEN", "T-ICELANDIC-NOIR"]
    exemplars_negative: []
    status: "active"

  - id: "AX-CREATIVE-COMBAT"
    label: "Креативна тактика замість сили"
    polarity: "love"
    intensity: 0.95
    domain: ["action", "conflict_resolution"]
    description: "Перемога над сильнішим ворогом через інтелект, креативне використання здібностей (хамон) або психологічний тиск, а не через те, що герой 'просто сильний' чи має плот-армор."
    exemplars_positive: ["T-JOJO-P2", "T-ONE-OUTS", "T-SAMURAI-CHAMPLOO"]
    exemplars_negative: ["T-COWBOY-BEBOP"]
    status: "active"

  - id: "AX-PRESSURE-ON-MC"
    label: "Моральний тиск на героя"
    polarity: "love"
    intensity: 0.85
    domain: ["character_arc", "plot_structure"]
    description: "Герой розвивається або ламається під впливом колосального зовнішнього чи психологічного тиску, і за цим цікаво спостерігати."
    exemplars_positive: ["T-MONSTER", "T-CODE-GEASS", "T-1984"]
    exemplars_negative: []
    status: "active"

  - id: "AX-ARTIFICIAL-MYSTERY"
    label: "Штучне закручування сюжету"
    polarity: "hate"
    intensity: -0.7
    domain: ["plot_structure"]
    description: "Історія виглядає як штучний 'mystery-box', де автор просто накидає несподівані повороти заради ефекту, замість того щоб органічно і лаконічно нашаровувати їх (як у Monster)."
    exemplars_positive: ["T-ODD-TAXI"]
    exemplars_negative: []
    status: "active"

  - id: "AX-JOURNEY-ATMOSPHERE"
    label: "Атмосфера подорожі"
    polarity: "love"
    intensity: 0.75
    domain: ["setting", "atmosphere"]
    description: "Відчуття дороги, руху, дух подорожі як самостійна естетична цінність, незалежно від сюжету чи персонажів."
    exemplars_positive: ["T-LOTR", "T-MONSTER"]
    exemplars_negative: []
    status: "active"

  - id: "AX-EPISODIC-NO-ANCHOR"
    label: "Епізодичність без наскрізного якоря"
    polarity: "hate"
    intensity: -0.6
    domain: ["plot_structure", "character_writing"]
    description: "Структура 'кожна серія — окрема історія' без наскрізного персонажа чи арки, що триває через увесь тайтл, систематично не тримає увагу — навіть при гарній атмосфері чи концепції."
    exemplars_positive: []
    exemplars_negative: ["T-DEATH-PARADE", "T-APOTHECARY-DIARIES-S2-S3", "T-MUSHISHI"]
    status: "active"

