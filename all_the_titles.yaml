    contradiction_flag: false
    verdict_note: "Дивився по тижню виходу всіх сезонів, тому детальна памʼять по ранніх сезонах змазана. Український переклад гарний. Сезон 1 дивився доволі беземоційно — головна фішка тоді була просто в тому, що це супергероїка не в стилі Marvel/DC, решта сюжету була не так важлива. Сезон 2 (твіст із Стормфронт-нацисткою, лінія Хоумлендер-Раян) не вразив особливо сильно, вже почав шукати в серіалі щось нове. Між сезонами 2 і 3 була помітно довша перерва — і саме тоді пропало відчуття 'чекання' наступного сезону, яке було після сезону 1. Сезон 3 знову зловив хайп через Солдатика (Soldier Boy) — новий, ще інший погляд на супергероїку, союз Butcher+Homelander проти нього, тимчасове викрадання суперздібностей — це сподобалось. Сезон 4: лінія Раяна з батьком відчувалась природно (просто хлопчик, з яким тусується тато, а не якийсь темний перехід на бік зла), Sister Sage як 'найрозумніша людина в світі' зацікавила як персонаж (хоча її арка в 5 сезоні так і не справдилась так, як вона хотіла), Firecracker — просто приємно дивитись, без глибини, The Deep — суто хайповий і креативний персонаж (нога, що звисає), без чогось особливо серйозного за цим. Frenchie & Kimiko — стосунки подані 'органічно на фоні крові й кишок', але це інший тип органічності, ніж буденна рутина в Ted Lasso чи Steins;Gate — тут органічність більше про те, що двоє тримаються одне одного на фоні апокаліптичного виживання. Сезон 5 (фінал) памʼятає найкраще: довга багатоходова лінія з вірусом — спершу хотіли вбити Хоумлендера, потім переключились на Солдатика, Солдатик виявився невразливим через Compound V-24, тоді Хоумлендер сам вколовся V-24 і став невразливим до вірусу, команда Butcher-а деморалізувалась, Френчі з Кіміко почали опромінювати себе радіацією, щоб повторити ефект Солдатика, і зрештою вбили Хоумлендера. Ключовий твіст: Butcher від початку взяв Х'юї в команду саме для того, щоб той в кінці зміг знешкодити самого Butcher-а, коли той зʼїде з глузду після перемоги над Хоумлендером. Дивився паралельно розбір коміксової версії фіналу на YouTube — концовки різні, але обидві зроблені гарно, серіальна не відчувається як 'злита'. Загалом: серіал не про глибокий сюжет, а вивозить на креативності й дуже оригінальних, яскравих персонажах — і за це саме подобається, все, що людям заходить в The Boys (Homelander, The Deep, Soldier Boy), заходить і тут."
